<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F3EA">
<title>林下农牧场 · 云认养｜高保真交互原型</title>
<style>
:root{
  --paper:#F5F3EA;
  --paper-2:#EFEDE1;
  --surface:#FFFFFF;
  --surface-2:#FBFAF4;
  --ink:#1C2720;
  --ink-2:#36463B;
  --muted:#6F7A6E;
  --muted-2:#9AA294;
  --line:#E5E2D5;
  --line-2:#EFEDE2;
  --green:#2F6042;
  --green-700:#254C34;
  --green-600:#376E4C;
  --green-300:#86AB92;
  --green-100:#E3EDE2;
  --green-50:#EFF4EC;
  --moss:#6F8556;
  --clay:#A9704E;
  --clay-100:#F4E8DD;
  --gold:#C19A56;
  --gold-100:#F7EEDC;
  --danger:#B5513F;
  --danger-100:#F8E5E0;
  --sky:#CFE3DE;
  --r-xl:26px;
  --r-lg:20px;
  --r-md:15px;
  --r-sm:11px;
  --status-h:44px;
  --home-h:22px;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,"Songti SC",STSong,serif;
  --mono:"SF Mono",Menlo,Consolas,"Courier New",monospace;
  --shadow-card:0 1px 2px rgba(28,39,32,.03),0 16px 34px -28px rgba(28,39,32,.5);
  --shadow-float:0 20px 44px -22px rgba(20,36,26,.45);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--sans);
  color:var(--ink);
  background:
    radial-gradient(1100px 760px at 8% 2%,#2B4635 0%,rgba(43,70,53,0) 58%),
    radial-gradient(900px 700px at 94% 96%,#263E2E 0%,rgba(38,62,46,0) 60%),
    #0E1712;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow:hidden;
}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button,input,textarea{font-family:inherit}
a{color:inherit}
::selection{background:#CFE0CF;color:#1C2720}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.ic{display:block;flex:none}

/* ===== 展示台 ===== */
.stage{position:relative;min-height:100dvh;display:flex;align-items:center;justify-content:center;gap:clamp(36px,5vw,84px);padding:28px 40px}
.stage-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.stage-bg::before{content:"";position:absolute;inset:-20%;background-image:repeating-radial-gradient(circle at 50% 48%,transparent 0 44px,rgba(255,255,255,.034) 44px 45px);opacity:.8}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55}
.orb-a{width:520px;height:520px;left:-120px;top:-160px;background:#3B6247}
.orb-b{width:460px;height:460px;right:-100px;bottom:-190px;background:#5A4B32;opacity:.4}
.orb-c{width:300px;height:300px;left:34%;bottom:-120px;background:#2C5540;opacity:.35}

.brand-panel{position:relative;z-index:2;width:326px;flex:0 0 auto;color:#EDF0E5;max-height:calc(100dvh - 48px);overflow-y:auto;scrollbar-width:none}
.brand-panel::-webkit-scrollbar{display:none}
.panel-logo-row{display:flex;align-items:center;gap:10px;margin-bottom:34px}
.panel-logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(150deg,#E8E3D0,#C9D3BE);color:#23402D;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 26px -14px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.7)}
.panel-word{font-family:var(--serif);font-size:11px;letter-spacing:.28em;color:#C9D1C0}
.panel-kicker{font-size:10px;letter-spacing:.2em;color:#94A691;text-transform:uppercase}
.panel-title{font-size:40px;line-height:1.22;font-weight:800;letter-spacing:-.03em;margin:13px 0 16px;color:#F2F1E6}
.panel-title span{font-weight:700;letter-spacing:-.02em;color:#DCC28C}
.panel-desc{font-size:13px;line-height:1.85;color:#A6B3A2;max-width:296px}
.panel-tags{display:flex;flex-wrap:wrap;gap:6px;margin:22px 0 28px}
.panel-tag{font-size:10.5px;color:#C7D2C2;padding:5px 9px;border-radius:7px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.045);backdrop-filter:blur(6px)}
.panel-label{font-size:9px;letter-spacing:.2em;color:#7F907E;margin-bottom:10px}
.panel-nav{display:flex;flex-wrap:wrap;gap:6px;max-width:320px}
.panel-nav button{font-size:11px;line-height:1;padding:8px 10px;border-radius:7px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.035);color:#B4C0B1;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.panel-nav button:hover{background:rgba(255,255,255,.1);color:#F1F1E6;border-color:rgba(255,255,255,.2)}
.panel-nav button.active{background:#E9E5D4;border-color:#E9E5D4;color:#223528;font-weight:800}
.panel-foot{margin-top:30px;display:flex;align-items:center;gap:8px;font-size:10px;color:#7C8D7B;letter-spacing:.02em}
.pulse-dot{width:6px;height:6px;border-radius:50%;background:#9DBE8E;position:relative}
.pulse-dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid rgba(157,190,142,.55);animation:pulse-ring 2.4s ease-out infinite}
@keyframes pulse-ring{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.5);opacity:0}}
.panel-reset{margin-left:8px;border:none;background:none;color:#AFC0AA;font-size:10px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}

.device-wrap{position:relative;z-index:2;flex:0 0 auto}
.device{position:relative;width:412px;height:min(866px,calc(100dvh - 64px));padding:11px;border-radius:58px;background:linear-gradient(155deg,#39443B 0%,#151B17 34%,#232B24 80%,#39443A 100%);box-shadow:0 70px 130px -40px rgba(0,0,0,.9),0 24px 60px -30px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.09)}
.device::after{content:"";position:absolute;inset:1px;border-radius:57px;background:linear-gradient(140deg,rgba(255,255,255,.16),transparent 30%,transparent 72%,rgba(255,255,255,.05));pointer-events:none;z-index:5}
.device-screen{position:relative;width:100%;height:100%;border-radius:47px;overflow:hidden;background:var(--paper);isolation:isolate}
#app{position:relative;width:100%;height:100%;overflow:hidden;color:var(--ink);background:var(--paper)}

/* ===== 系统栏 ===== */
.statusbar{position:absolute;top:0;left:0;right:0;height:var(--status-h);z-index:130;display:flex;align-items:center;justify-content:space-between;padding:0 24px 0 28px;font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--ink);pointer-events:none;background:var(--paper)}
.status-right{display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.home-indicator{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);width:128px;height:5px;border-radius:3px;background:#1C2720;opacity:.24;z-index:125;pointer-events:none}

/* ===== 页面 ===== */
.page{position:absolute;top:var(--status-h);left:0;right:0;bottom:var(--home-h);display:none;flex-direction:column;overflow:hidden}
.page.active{display:flex;animation:page-in .44s cubic-bezier(.22,.9,.28,1)}
@keyframes page-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.page-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 18px 30px;scrollbar-width:none;overscroll-behavior:contain}
.page-scroll::-webkit-scrollbar{display:none}
.home-scroll{padding:0 0 116px}
.home-sec{padding:0 18px;margin-top:25px}

/* ===== 通用组件 ===== */
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.center{justify-content:center}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.tiny{font-size:10.5px}
.mono{font-family:var(--mono)}
.serif{font-family:var(--serif)}
.eyebrow{display:block;font-family:var(--serif);font-size:9.5px;letter-spacing:.2em;color:var(--moss);text-transform:uppercase;margin-bottom:5px}
.page-title{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.14}
.page-lead{font-size:12px;color:var(--muted);line-height:1.7;margin-top:6px}
.divider{height:1px;background:var(--line-2);margin:13px 0}
.page-intro{display:flex;align-items:flex-start;justify-content:space-between;margin:12px 2px 18px;gap:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:50px;padding:0 20px;border-radius:15px;border:1px solid transparent;background:none;font-size:14px;font-weight:800;letter-spacing:.01em;cursor:pointer;transition:transform .14s ease,filter .2s ease,background .2s ease;white-space:nowrap}
.btn:active{transform:scale(.968)}
.btn-primary{background:linear-gradient(180deg,#3B704E,#2B573C);color:#fff;box-shadow:0 12px 24px -14px rgba(36,76,52,.95),inset 0 1px 0 rgba(255,255,255,.18)}
.btn-primary:hover{filter:brightness(1.05)}
.btn-ghost{background:rgba(28,39,32,.055);color:var(--ink)}
.btn-outline{background:rgba(255,255,255,.4);border-color:rgba(28,39,32,.14);color:var(--ink)}
.btn-soft{background:var(--green-100);color:var(--green)}
.btn-wood{background:linear-gradient(180deg,#BA8560,#9C6B49);color:#fff;box-shadow:0 12px 24px -14px rgba(136,91,62,.9),inset 0 1px 0 rgba(255,255,255,.2)}
.btn-danger-soft{background:var(--danger-100);color:var(--danger)}
.btn-sm{height:36px;padding:0 13px;border-radius:11px;font-size:12px;gap:4px}
.btn-xs{height:28px;padding:0 10px;border-radius:9px;font-size:10.5px;gap:3px}
.btn-block{width:100%}
.btn-icon{width:50px;padding:0;flex:none}
.btn[disabled]{opacity:.42;pointer-events:none}
.btn .ic{flex:none}

.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid rgba(28,39,32,.07);background:rgba(255,255,255,.72);display:inline-flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer;transition:transform .15s,background .2s;flex:none;backdrop-filter:blur(8px)}
.icon-btn:active{transform:scale(.93)}
.icon-btn.sm{width:32px;height:32px}
.icon-btn.plain{background:none;border-color:transparent}
.has-dot{position:relative}
.red-dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 2px var(--paper)}
.link{color:var(--green);text-decoration:underline;text-underline-offset:2px;cursor:pointer}

.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:7px;font-size:9.5px;font-weight:800;letter-spacing:.015em;white-space:nowrap;line-height:1}
.tag i{width:4px;height:4px;border-radius:50%;background:currentColor;flex:none}
.tag--green{background:var(--green-100);color:#2F6142}
.tag--wood{background:var(--clay-100);color:#8A5A3C}
.tag--gold{background:var(--gold-100);color:#876428}
.tag--muted{background:#EEEEE6;color:#778071}
.tag--danger{background:var(--danger-100);color:var(--danger)}
.tag--ink{background:#28362C;color:#EFEFE4}
.tag--glass{background:rgba(255,255,255,.76);color:var(--ink);backdrop-filter:blur(8px);box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}

.progress{flex:1;height:6px;border-radius:4px;background:#EBEDE3;overflow:hidden}
.progress-fill{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#7FA98B,#2F6042);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.progress-fill.wood{background:linear-gradient(90deg,#D2A783,#A06B47)}
.progress-fill.gold{background:linear-gradient(90deg,#E4CB90,#B98E3F)}
.bar-row{display:flex;align-items:center;gap:8px}
.pct{font-size:10px;font-weight:800;color:var(--green);font-family:var(--serif);letter-spacing:.02em}

.card{background:var(--surface);border:1px solid rgba(28,39,32,.06);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow-card)}
.card--flat{box-shadow:none}
.card--pad0{padding:0;overflow:hidden}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:12px}
.sec-head h2{font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.sec-head .sec-sub{font-size:9.5px;color:var(--muted);font-weight:500;margin-top:3px}
.sec-link{display:inline-flex;align-items:center;gap:1px;background:none;border:none;color:var(--moss);font-size:10.5px;font-weight:800;cursor:pointer;padding:4px 0}
.sec-kicker{display:block;font-family:var(--serif);font-size:8.5px;letter-spacing:.18em;color:var(--muted-2);text-transform:uppercase;margin-bottom:4px}

/* ===== 顶部导航 / 底部 Tab ===== */
.topnav{position:relative;z-index:40;flex:none;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:linear-gradient(180deg,rgba(245,243,234,.98),rgba(245,243,234,.84));backdrop-filter:blur(18px)}
.nav-title{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:14.5px;font-weight:800;letter-spacing:.01em;white-space:nowrap}
.nav-btn{width:38px;height:38px;border-radius:50%;border:1px solid rgba(28,39,32,.07);background:rgba(255,255,255,.66);display:flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer;transition:transform .15s,background .2s;flex:none}
.nav-btn:active{transform:scale(.93)}
.nav-btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.nav-text{height:34px;padding:0 10px;border-radius:10px;border:none;background:rgba(28,39,32,.05);font-size:10.5px;font-weight:800;color:var(--ink-2);cursor:pointer;display:flex;align-items:center;gap:4px}

.tabbar{position:absolute;left:10px;right:10px;bottom:calc(var(--home-h) + 6px);height:64px;z-index:110;display:flex;align-items:center;padding:0 6px;border-radius:22px;background:rgba(255,255,255,.87);border:1px solid rgba(28,39,32,.06);box-shadow:0 16px 36px -18px rgba(28,39,32,.45);backdrop-filter:blur(22px) saturate(1.4);transition:transform .4s cubic-bezier(.22,.9,.28,1),opacity .3s}
.tabbar.is-hidden{transform:translateY(130px);opacity:0;pointer-events:none}
.tab{flex:1;height:52px;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#8C978A;font-size:9.5px;font-weight:700;cursor:pointer;position:relative;border-radius:16px;transition:color .2s}
.tab-ic{width:38px;height:27px;border-radius:10px;display:flex;align-items:center;justify-content:center;transition:background .25s,color .2s,transform .25s}
.tab.active{color:var(--green)}
.tab.active .tab-ic{background:var(--green-100);color:var(--green)}
.tab:active .tab-ic{transform:scale(.92)}
.tab-badge{position:absolute;top:3px;left:calc(50% + 5px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--clay);color:#fff;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff}

/* ===== 首页 ===== */
.home-head{padding:6px 18px 14px}
.brandline{display:flex;align-items:center;gap:9px}
.brandmark{width:34px;height:34px;border-radius:11px;background:linear-gradient(150deg,#3B704E,#255033);color:#EDF3E7;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px -10px rgba(47,96,66,.9),inset 0 1px 0 rgba(255,255,255,.16);flex:none}
.brand-en{font-family:var(--serif);font-size:8.5px;letter-spacing:.18em;color:var(--moss);line-height:1.25}
.brand-cn{font-size:13px;font-weight:800;line-height:1.2;margin-top:1px;letter-spacing:.01em}
.weather-chip{display:flex;align-items:center;gap:4px;height:30px;padding:0 9px;border-radius:10px;background:rgba(255,255,255,.72);border:1px solid rgba(28,39,32,.055);font-size:10.5px;font-weight:800;color:var(--ink-2);margin-left:auto}
.weather-chip .ic{color:#C29A56}
.weather-chip i{font-style:normal;color:var(--muted);font-weight:500}
.home-hello{margin-top:17px}
.home-hello h1{font-size:23px;font-weight:800;letter-spacing:-.035em;line-height:1.25}
.home-hello p{font-size:10.5px;color:var(--muted);margin-top:5px;letter-spacing:.02em}

.hero-home{position:relative;margin:0 16px;height:226px;border-radius:27px;overflow:hidden;background:linear-gradient(138deg,#1D3928 0%,#2C5540 54%,#4B7657 100%);box-shadow:0 28px 54px -26px rgba(24,48,34,.8);isolation:isolate}
.hero-home::after{content:"";position:absolute;inset:0;z-index:1;background:radial-gradient(130% 90% at 88% 0%,rgba(214,230,195,.24),transparent 55%),linear-gradient(90deg,rgba(18,38,26,.28),transparent 65%);pointer-events:none}
.hero-art{position:absolute;right:-32px;bottom:-18px;width:310px;height:220px;z-index:0;color:#DCE9CE;opacity:.72}
.hero-copy{position:relative;z-index:2;height:100%;padding:22px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;color:#F4F3E7}
.hero-kicker{font-family:var(--serif);font-size:8.5px;letter-spacing:.26em;color:#C8D8B9;margin-bottom:9px}
.hero-copy h1{font-size:24px;line-height:1.34;font-weight:800;letter-spacing:-.025em;text-shadow:0 2px 22px rgba(0,0,0,.14)}
.hero-copy h1 em{font-style:normal;color:#E6CF9E}
.hero-copy p{font-size:10.5px;line-height:1.6;color:rgba(244,243,231,.7);margin-top:8px;letter-spacing:.02em;max-width:190px}
.hero-btn{margin-top:15px;height:38px;padding:0 14px;border-radius:11px;border:none;background:#F5F1E1;color:#27452F;font-size:11.5px;font-weight:800;display:inline-flex;align-items:center;gap:5px;cursor:pointer;box-shadow:0 12px 22px -14px rgba(0,0,0,.7);transition:transform .15s}
.hero-btn:active{transform:scale(.96)}

.home-stats{position:relative;z-index:3;margin:-24px 26px 0;display:flex;padding:12px 4px;border-radius:19px;background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.85);box-shadow:0 20px 40px -26px rgba(28,39,32,.5);backdrop-filter:blur(18px)}
.home-stat{flex:1;text-align:center;position:relative;cursor:pointer;border-radius:12px}
.home-stat + .home-stat::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:1px;height:23px;background:var(--line-2)}
.home-stat b{display:block;font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:-.02em;line-height:1;color:var(--ink)}
.home-stat b i{font-style:normal;font-family:var(--sans);font-size:9.5px;font-weight:500;color:var(--muted);margin-left:2px}
.home-stat span{display:block;font-size:9px;color:var(--muted);margin-top:5px;letter-spacing:.03em}

.cat-scroll{display:flex;gap:5px;overflow-x:auto;padding:2px 18px 4px;margin:0 -18px;scrollbar-width:none;scroll-snap-type:x proximity}
.cat-scroll::-webkit-scrollbar{display:none}
.cat-item{flex:0 0 62px;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;padding:3px 0;cursor:pointer;scroll-snap-align:start}
.cat-ic{width:50px;height:50px;border-radius:17px;background:var(--tint);color:var(--tone);display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 8px 16px -14px rgba(28,39,32,.6);transition:transform .2s}
.cat-item:active .cat-ic{transform:scale(.94)}
.cat-item > span:last-child{font-size:10px;font-weight:700;color:var(--ink-2);white-space:nowrap}

.plot-scroll{display:flex;gap:12px;overflow-x:auto;padding:2px 18px 8px;margin:0 -18px;scrollbar-width:none;scroll-snap-type:x mandatory}
.plot-scroll::-webkit-scrollbar{display:none}
.plot-card{flex:0 0 236px;scroll-snap-align:start;text-align:left;padding:0;border-radius:20px;background:#fff;border:1px solid rgba(28,39,32,.07);overflow:hidden;cursor:pointer;box-shadow:0 16px 34px -28px rgba(28,39,32,.55);transition:transform .2s}
.plot-card:active{transform:scale(.985)}
.plot-card-art{position:relative;height:112px}
.plot-card-body{padding:12px 14px 14px}
.plot-card-name{font-size:14.5px;font-weight:800;letter-spacing:-.01em}
.plot-card-body .meta{font-size:10px;color:var(--muted);margin-top:3px}
.plot-card-foot{display:flex;align-items:flex-end;justify-content:space-between;margin-top:10px}
.price{font-family:var(--serif);font-weight:600;font-size:19px;color:var(--clay);letter-spacing:-.02em;line-height:1}
.price i{font-style:normal;font-family:var(--sans);font-size:9.5px;font-weight:500;color:var(--muted);margin-left:2px}
.round-arrow{width:28px;height:28px;border-radius:50%;background:var(--green-50);color:var(--green);display:flex;align-items:center;justify-content:center;flex:none}

.plot-art{position:relative;height:100%;background:linear-gradient(145deg,var(--tint),#FBF9F1 84%);overflow:hidden}
.plot-art .art-scene{position:absolute;left:0;right:0;bottom:-14px;width:100%;height:82%;color:var(--tone);opacity:.3}
.plot-art-code{position:absolute;left:13px;top:11px;font-family:var(--serif);font-size:8.5px;letter-spacing:.14em;color:var(--tone);opacity:.72}
.plot-art-glyph{position:absolute;left:14px;bottom:12px;width:50px;height:50px;border-radius:15px;background:rgba(255,255,255,.76);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;color:var(--tone);box-shadow:0 10px 20px -14px rgba(28,39,32,.6),inset 0 1px 0 rgba(255,255,255,.9)}
.plot-card-art .tag{position:absolute;right:9px;top:9px}

.grow-list{display:flex;flex-direction:column;gap:9px}
.grow-card{display:flex;align-items:center;gap:11px;padding:11px;background:#fff;border:1px solid rgba(28,39,32,.06);border-radius:17px;cursor:pointer;text-align:left;box-shadow:0 12px 28px -26px rgba(28,39,32,.55);transition:transform .18s}
.grow-card:active{transform:scale(.99)}
.grow-thumb{width:52px;height:52px;border-radius:15px;background:var(--tint);color:var(--tone);display:flex;align-items:center;justify-content:center;flex:none;border:1px solid rgba(255,255,255,.6)}
.grow-main{flex:1;min-width:0}
.grow-main .row b{font-size:13.5px;font-weight:800;letter-spacing:-.01em}
.grow-main .meta{font-size:9.5px;color:var(--muted);margin:3px 0 7px}
.grow-main .pct{min-width:27px;text-align:right}

.feed-card{padding:4px 15px}
.feed-row{display:flex;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line-2);align-items:flex-start}
.feed-row:last-child{border-bottom:none}
.feed-avatar{width:32px;height:32px;border-radius:50%;background:var(--green-50);display:flex;align-items:center;justify-content:center;font-size:16px;flex:none;border:1px solid rgba(47,96,66,.08)}
.feed-text{font-size:11px;line-height:1.55;color:var(--ink-2)}
.feed-text b{font-weight:800;color:var(--ink)}
.feed-text em{font-style:normal;color:var(--green);font-weight:700}
.feed-time{font-size:9px;color:var(--muted-2);margin-top:3px}
.invite-strip{width:100%;margin-top:14px;border:none;border-radius:17px;padding:14px 15px;background:linear-gradient(120deg,#2A4C35,#3B6548);color:#EAEFE2;display:flex;align-items:center;gap:10px;cursor:pointer;text-align:left;box-shadow:0 16px 30px -22px rgba(28,60,40,.9)}
.invite-strip .ic{color:#DCC28C}
.invite-strip .grow b{font-size:12px;font-weight:800;display:block}
.invite-strip .grow > span{font-size:9.5px;color:rgba(234,239,226,.65);display:block;margin-top:2px}
.invite-strip .round-arrow{margin-left:auto;background:rgba(255,255,255,.12);color:#F2F0E4}

/* ===== 地图 ===== */
#page-map{background:#E9EFE1}
.map-wrap{position:relative;flex:1;overflow:hidden}
.map-canvas{position:absolute;inset:0}
.map-canvas svg{display:block;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none}
.map-canvas svg:active{cursor:grabbing}
.map-world{transition:transform .18s ease-out}
.map-tree{pointer-events:none}
.map-plot{cursor:pointer;transition:opacity .25s}
.map-plot .plot-face{transition:filter .2s,stroke .2s,stroke-width .2s}
.map-plot.active .plot-face{stroke:#FFFFFF;stroke-width:3;filter:drop-shadow(0 8px 14px rgba(25,49,34,.35))}
.map-plot.active .plot-label-bg{fill:#1F3B2A}
.map-plot.active .plot-label-text{fill:#FFFFFF}
.map-plot.active .plot-label-dot{fill:#E2CD9C}
.map-plot.dim{opacity:.22;pointer-events:none}
.map-top{position:absolute;top:10px;left:12px;right:12px;z-index:20;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.map-title{pointer-events:auto;display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:15px;background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.72);box-shadow:0 14px 30px -20px rgba(28,39,32,.65);backdrop-filter:blur(18px)}
.map-pin{width:30px;height:30px;border-radius:10px;background:var(--green-100);color:var(--green);display:flex;align-items:center;justify-content:center;flex:none}
.map-title b{display:block;font-size:13px;font-weight:800;letter-spacing:-.01em}
.map-title > div > span{display:block;font-size:9px;color:var(--muted);margin-top:1px}
.map-filter-btn{pointer-events:auto;width:40px;height:40px;border-radius:14px;border:1px solid rgba(255,255,255,.72);background:rgba(255,255,255,.9);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 14px 30px -20px rgba(28,39,32,.65);backdrop-filter:blur(18px);transition:transform .15s}
.map-filter-btn:active{transform:scale(.94)}
.map-filters{position:absolute;top:64px;left:12px;right:12px;z-index:19;display:flex;gap:5px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.map-filters::-webkit-scrollbar{display:none}
.map-chip{flex:none;display:inline-flex;align-items:center;gap:3px;height:30px;padding:0 11px;border-radius:10px;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.76);backdrop-filter:blur(12px);font-size:10px;font-weight:800;color:var(--ink-2);cursor:pointer;white-space:nowrap;transition:background .2s,color .2s,transform .15s}
.map-chip:active{transform:scale(.96)}
.map-chip.active{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 8px 18px -10px rgba(47,96,66,.9)}
.map-chip.cat{background:#263A2D;color:#F1F0E4;border-color:#263A2D}
.map-legend{position:absolute;bottom:232px;left:12px;z-index:18;display:flex;gap:8px;padding:5px 8px;border-radius:9px;background:rgba(255,255,255,.72);backdrop-filter:blur(10px);font-size:8.5px;color:var(--ink-2);font-weight:600}
.map-legend span{display:flex;align-items:center;gap:3px}
.map-legend i{width:6px;height:6px;border-radius:2px;flex:none}
.map-tools{position:absolute;right:12px;bottom:272px;z-index:18;display:flex;flex-direction:column;gap:6px}
.map-tool{width:36px;height:36px;border-radius:11px;border:1px solid rgba(28,39,32,.06);background:rgba(255,255,255,.92);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 10px 20px -14px rgba(28,39,32,.6);backdrop-filter:blur(8px);transition:transform .15s}
.map-tool:active{transform:scale(.93)}
.map-sheet{position:absolute;left:12px;right:12px;bottom:86px;z-index:25;padding:12px;border-radius:22px;background:rgba(255,255,255,.95);border:1px solid rgba(255,255,255,.8);box-shadow:0 26px 50px -24px rgba(20,36,26,.65);backdrop-filter:blur(22px)}
.map-sheet-top{display:flex;align-items:center;gap:11px}
.map-sheet-thumb{width:54px;height:54px;border-radius:16px;background:var(--tint);color:var(--tone);display:flex;align-items:center;justify-content:center;flex:none;border:1px solid rgba(255,255,255,.65)}
.map-sheet-name{font-size:14.5px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
.map-sheet-meta{font-size:9.5px;color:var(--muted);margin-top:4px}
.map-sheet-price{text-align:right;flex:none}
.map-sheet-price b{font-family:var(--serif);font-size:18px;font-weight:600;color:var(--clay)}
.map-sheet-price span{display:block;font-size:8.5px;color:var(--muted-2);margin-top:1px}
.map-sheet-actions{display:flex;gap:7px;margin-top:11px}
.map-sheet-actions .btn{flex:1;height:40px;border-radius:12px;font-size:12px}
.map-sheet-actions .btn.icon-only{flex:0 0 44px;padding:0}

/* ===== 地块详情 ===== */
.detail-hero{position:relative;height:198px;margin-top:6px;border-radius:25px;overflow:hidden;background:linear-gradient(150deg,var(--tint),#FDFCF6 90%);border:1px solid rgba(28,39,32,.05);isolation:isolate}
.detail-hero .art-scene{position:absolute;left:0;right:0;bottom:-22px;width:100%;height:76%;color:var(--tone);opacity:.26}
.detail-hero-top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:12px}
.detail-glyph{position:absolute;left:18px;bottom:18px;z-index:2;width:78px;height:78px;border-radius:24px;background:rgba(255,255,255,.74);backdrop-filter:blur(10px);color:var(--tone);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 #fff,0 16px 30px -16px rgba(28,39,32,.55)}
.detail-hero-foot{position:absolute;right:17px;bottom:19px;z-index:2;text-align:right}
.detail-hero-foot b{display:block;font-size:11px;font-weight:800;color:var(--ink-2)}
.detail-hero-foot span{font-size:9px;color:var(--muted);display:block;margin-top:2px}
.detail-head{padding:16px 2px 0}
.detail-title-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.detail-title-row h1{font-size:25px;font-weight:800;letter-spacing:-.035em;line-height:1.15}
.detail-desc{font-size:11.5px;line-height:1.75;color:var(--muted);margin-top:7px}
.info-card{display:grid;grid-template-columns:1fr 1fr 1fr;margin-top:14px;padding:14px 0;background:#fff;border:1px solid rgba(28,39,32,.06);border-radius:18px;box-shadow:var(--shadow-card)}
.info-cell{position:relative;text-align:center}
.info-cell + .info-cell::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:1px;height:25px;background:var(--line-2)}
.info-cell span{display:block;font-size:9px;color:var(--muted)}
.info-cell b{display:block;margin-top:4px;font-size:13px;font-weight:800}
.info-cell b.price{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--clay)}
.detail-sec{margin-top:21px}
.detail-sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.detail-sec-head h3{font-size:14.5px;font-weight:800;letter-spacing:-.01em}
.detail-sec-head span{font-size:9.5px;color:var(--muted)}
.stage-track{display:flex;margin-top:5px}
.stage-item{flex:1;text-align:center;position:relative}
.stage-node{position:relative;z-index:2;width:30px;height:30px;margin:0 auto 6px;border-radius:50%;background:#F0F1E9;border:1px solid transparent;color:#A4AC9E;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.stage-item.done .stage-node{background:var(--green-100);color:var(--green);border-color:#CFE0D2}
.stage-item.current .stage-node{background:var(--green);color:#fff;box-shadow:0 0 0 4px rgba(47,96,66,.12)}
.stage-item span{font-size:8.5px;font-weight:700;color:var(--muted-2)}
.stage-item.done span{color:var(--ink-2)}
.stage-item.current span{color:var(--green);font-weight:800}
.stage-line{position:absolute;top:15px;left:calc(50% + 15px);width:calc(100% - 30px);height:2px;background:#E7E9DF;z-index:1;border-radius:2px}
.stage-item.done .stage-line{background:#B8CFBE}
.growth-foot{display:flex;align-items:flex-end;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line-2)}
.growth-foot .pct-big{font-family:var(--serif);font-size:26px;font-weight:600;color:var(--green);line-height:1;letter-spacing:-.02em}
.growth-foot > div > span{font-size:9px;color:var(--muted);display:block;margin-top:3px}
.live-teaser{position:relative;height:88px;border-radius:17px;overflow:hidden;background:linear-gradient(120deg,#20382A,#3D674B);display:flex;align-items:center;gap:12px;padding:14px;color:#F0F1E6;cursor:pointer;box-shadow:0 16px 30px -22px rgba(28,60,40,.9)}
.live-teaser::after{content:"";position:absolute;inset:0;background:radial-gradient(90% 120% at 90% 0%,rgba(210,225,190,.22),transparent 60%)}
.live-teaser .live-cam{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;flex:none;backdrop-filter:blur(4px);position:relative;z-index:2}
.live-teaser .grow{position:relative;z-index:2}
.live-teaser .grow b{display:block;font-size:13px;font-weight:800}
.live-teaser .grow > span{display:block;font-size:9.5px;color:rgba(240,241,230,.62);margin-top:3px}
.live-teaser .round-arrow{position:relative;z-index:2;background:rgba(255,255,255,.14);color:#F2F0E4}
.live-dot{width:6px;height:6px;border-radius:50%;background:#F06B4F;box-shadow:0 0 0 3px rgba(240,107,79,.18);animation:live-blink 1.6s ease infinite}
@keyframes live-blink{50%{opacity:.4}}
.benefit-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.benefit{display:flex;align-items:center;gap:8px;padding:11px;background:#fff;border:1px solid rgba(28,39,32,.06);border-radius:13px;font-size:10.5px;font-weight:700;color:var(--ink-2);box-shadow:0 8px 18px -20px rgba(28,39,32,.5)}
.benefit-ic{width:30px;height:30px;border-radius:9px;background:var(--green-50);color:var(--green);display:flex;align-items:center;justify-content:center;flex:none}
.care-line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line-2)}
.care-line:last-child{border-bottom:none}
.care-line .care-ic{width:34px;height:34px;border-radius:10px;background:var(--green-50);color:var(--green);display:flex;align-items:center;justify-content:center;flex:none}
.care-line .grow > b{display:block;font-size:12px;font-weight:800}
.care-line .grow > span{display:block;font-size:9px;color:var(--muted);margin-top:2px}
.record{display:flex;gap:11px;padding:9px 0}
.record-date{width:50px;flex:none;font-family:var(--serif);font-size:9px;color:var(--muted);padding-top:2px}
.record-dot{width:7px;height:7px;border-radius:50%;background:var(--green);margin-top:5px;position:relative;flex:none}
.record-dot::after{content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);width:1px;height:26px;background:var(--line)}
.record:last-child .record-dot::after{display:none}
.record-body b{display:block;font-size:11.5px;font-weight:700}
.record-body span{display:block;font-size:9px;color:var(--muted);margin-top:2px}
.trust-row{display:flex;gap:6px;flex-wrap:wrap}
.trust-pill{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 9px;border-radius:8px;background:rgba(255,255,255,.7);border:1px solid rgba(28,39,32,.06);font-size:9px;font-weight:700;color:var(--ink-2)}

.dock{flex:none;display:none;padding:10px 16px 12px;background:rgba(250,249,243,.9);backdrop-filter:blur(20px);border-top:1px solid rgba(28,39,32,.07);z-index:45}
.dock.show{display:flex;align-items:center;gap:9px;animation:dock-in .35s ease}
@keyframes dock-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.dock .price-block{flex:1;min-width:0}
.dock .price-block span{display:block;font-size:9px;color:var(--muted)}
.dock .price-block b{display:block;margin-top:1px;font-family:var(--serif);font-size:21px;font-weight:600;color:var(--clay);line-height:1.1}
.dock .price-block b i{font-family:var(--sans);font-style:normal;font-size:9px;color:var(--muted);font-weight:500;margin-left:2px}
.dock .btn{flex:none}
.dock .btn.grow{flex:1}

/* ===== 认养下单 / 表单 ===== */
.steps{display:flex;align-items:center;margin:8px 2px 18px}
.step{display:flex;align-items:center;gap:6px;flex:none}
.step-dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;background:#ECEEE5;color:var(--muted);border:1px solid transparent;transition:.2s}
.step.active .step-dot{background:var(--green);color:#fff;box-shadow:0 0 0 4px rgba(47,96,66,.1)}
.step.done .step-dot{background:var(--green-100);color:var(--green)}
.step > span:last-child{font-size:9.5px;color:var(--muted);font-weight:600;white-space:nowrap}
.step.active span{color:var(--ink);font-weight:800}
.step-line{flex:1;height:1.5px;margin:0 7px;border-radius:1px;background:#E5E7DD}
.step-line.done{background:#B8CFBE}
.plot-mini{display:flex;align-items:center;gap:12px}
.plot-mini .grow-thumb{width:58px;height:58px;border-radius:17px}
.plot-mini b{font-size:15px;font-weight:800;letter-spacing:-.01em}
.plot-mini p{font-size:9.5px;line-height:1.6;color:var(--muted);margin-top:3px}
.dashed{height:1px;border-top:1px dashed var(--line);margin:13px 0}
.kv{display:flex;align-items:center;justify-content:space-between;padding:4px 0;font-size:11.5px;color:var(--muted);gap:12px}
.kv b{font-size:12px;color:var(--ink);font-weight:700;text-align:right}
.kv.total{margin-top:6px;padding-top:10px;border-top:1px solid var(--line-2);font-size:12.5px;color:var(--ink);font-weight:700}
.kv.total b{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--clay)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg-btn{position:relative;height:62px;border-radius:13px;border:1.5px solid var(--line);background:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:800;color:var(--ink-2);transition:.2s}
.seg-btn small{font-size:8.5px;color:var(--muted);font-weight:500}
.seg-btn.on{border-color:var(--green);background:var(--green-50);color:var(--green);box-shadow:0 0 0 3px rgba(47,96,66,.07)}
.seg-btn .badge-rec{position:absolute;top:-7px;right:7px;padding:1px 5px;border-radius:5px;background:var(--clay);color:#fff;font-size:8px;font-weight:800;letter-spacing:.02em}
.field{margin-bottom:12px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:10px;font-weight:800;color:var(--muted);margin-bottom:5px;letter-spacing:.02em}
.field label i{font-style:normal;color:var(--danger)}
.input,.textarea{width:100%;height:46px;padding:0 13px;border:1px solid var(--line);border-radius:12px;background:#FBFAF4;font-size:13px;color:var(--ink);outline:none;transition:border-color .2s,background .2s,box-shadow .2s}
.textarea{height:76px;padding:11px 13px;resize:none;line-height:1.6}
.input:focus,.textarea:focus{border-color:var(--green-300);background:#fff;box-shadow:0 0 0 3px rgba(47,96,66,.08)}
.input::placeholder,.textarea::placeholder{color:#AEB5A9}
.pay-option{display:flex;align-items:center;gap:10px;padding:11px;margin-bottom:8px;border-radius:13px;border:1.5px solid var(--line);background:#fff;cursor:pointer;transition:.2s}
.pay-option:last-child{margin-bottom:0}
.pay-option.on{border-color:var(--green);background:var(--green-50)}
.pay-logo{width:34px;height:34px;border-radius:10px;background:#E8F4EB;color:#2C8A4A;display:flex;align-items:center;justify-content:center;flex:none}
.pay-logo.balance{background:var(--gold-100);color:#9A7128}
.pay-option b{display:block;font-size:12px;font-weight:800}
.pay-option small{display:block;font-size:9px;color:var(--muted);margin-top:2px}
.radio{width:18px;height:18px;border-radius:50%;border:1.5px solid #C9CFC3;display:flex;align-items:center;justify-content:center;flex:none;transition:.2s}
.pay-option.on .radio{border-color:var(--green)}
.pay-option.on .radio::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--green)}
.checkline{display:flex;align-items:flex-start;gap:8px;font-size:9.5px;line-height:1.65;color:var(--muted)}
.checkline input{width:14px;height:14px;accent-color:var(--green);margin-top:1px;flex:none}
.summary-card{background:linear-gradient(165deg,#fff,#FBFAF2);border:1px solid rgba(28,39,32,.06);border-radius:20px;padding:16px;box-shadow:var(--shadow-card)}
.summary-label{font-size:9.5px;letter-spacing:.14em;color:var(--muted-2);font-family:var(--serif);text-transform:uppercase;margin-bottom:9px}
.pay-amount{text-align:center;padding:4px 0 12px}
.pay-amount b{font-family:var(--serif);font-size:40px;font-weight:500;letter-spacing:-.03em;line-height:1;color:var(--ink)}
.pay-amount span{display:block;font-size:10px;color:var(--muted);margin-top:5px}
.pay-dots{display:flex;justify-content:center;margin:14px 0 18px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.pay-dot{width:45px;height:46px;border-right:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.pay-dot:last-child{border-right:none}
.pay-dot i{width:9px;height:9px;border-radius:50%;background:var(--ink);opacity:0;transform:scale(.4);transition:.15s}
.pay-dot.filled i{opacity:1;transform:scale(1)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{height:50px;border-radius:12px;border:none;background:#F5F4EC;color:var(--ink);font-family:var(--serif);font-size:20px;font-weight:600;cursor:pointer;transition:.12s}
.key:active{background:#E8EADF;transform:scale(.97)}
.key.blank{background:none;pointer-events:none}
.key.del{background:none;font-size:15px;font-family:var(--sans);color:var(--muted)}
.success{position:relative;text-align:center;padding:4px 0 0;overflow:hidden}
.success-icon{width:64px;height:64px;margin:0 auto 12px;border-radius:50%;background:var(--green-100);color:var(--green);display:flex;align-items:center;justify-content:center;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.success h2{font-size:19px;font-weight:800;letter-spacing:-.025em}
.success p{font-size:11px;line-height:1.75;color:var(--muted);margin-top:5px}
.reward-row{display:flex;justify-content:center;gap:7px;margin-top:12px;flex-wrap:wrap}
.reward{padding:6px 11px;border-radius:9px;background:var(--green-50);color:var(--green);font-size:10.5px;font-weight:800}
.reward.gold{background:var(--gold-100);color:#8A6828}

/* ===== 我的林场 ===== */
.my-hero{position:relative;overflow:hidden;margin-top:8px;padding:18px;border-radius:23px;background:linear-gradient(135deg,#24422E,#396248 62%,#4F7A58);color:#EFF1E4;box-shadow:0 24px 46px -28px rgba(25,49,34,.9)}
.my-hero::after{content:"";position:absolute;right:-46px;top:-58px;width:190px;height:190px;border-radius:50%;border:1px solid rgba(255,255,255,.12);box-shadow:0 0 0 26px rgba(255,255,255,.035),0 0 0 52px rgba(255,255,255,.025)}
.my-hero .hero-tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:7px;background:rgba(255,255,255,.12);font-size:8.5px;font-weight:700;color:#D8E3CF;letter-spacing:.04em}
.my-hero-top{display:flex;align-items:center;gap:14px;position:relative;z-index:2}
.my-hero h1{font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.2;margin-top:6px}
.my-hero p{font-size:9.5px;color:rgba(239,241,228,.64);margin-top:4px}
.ring{position:relative;width:70px;height:70px;border-radius:50%;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;background:conic-gradient(#DCC28C calc(var(--p,0)*1%),rgba(255,255,255,.14) 0)}
.ring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:#2B4A35}
.ring b{position:relative;z-index:2;font-family:var(--serif);font-size:18px;font-weight:600;color:#F4F1DF;line-height:1}
.ring b i{font-style:normal;font-size:8px;opacity:.7}
.ring small{position:relative;z-index:2;display:block;font-size:7px;color:rgba(239,241,228,.55);text-align:center;margin-top:2px}
.my-stats{display:flex;position:relative;z-index:2;margin-top:16px;padding-top:13px;border-top:1px solid rgba(255,255,255,.1)}
.my-stat{flex:1;text-align:center;position:relative}
.my-stat + .my-stat::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:1px;height:20px;background:rgba(255,255,255,.12)}
.my-stat b{display:block;font-family:var(--serif);font-size:17px;font-weight:600;line-height:1;color:#F4F1DF}
.my-stat b i{font-family:var(--sans);font-style:normal;font-size:8px;color:rgba(239,241,228,.5);margin-left:2px}
.my-stat span{display:block;font-size:8px;color:rgba(239,241,228,.5);margin-top:5px}
.filter-row{display:flex;gap:5px;margin:16px 0 12px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.filter-btn{flex:none;height:32px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.6);color:var(--muted);font-size:10.5px;font-weight:700;cursor:pointer;transition:.2s}
.filter-btn.on{background:var(--ink);border-color:var(--ink);color:#F3F1E5;box-shadow:0 8px 16px -12px rgba(28,39,32,.8)}
.plot-wide{background:#fff;border:1px solid rgba(28,39,32,.06);border-radius:19px;padding:14px;box-shadow:var(--shadow-card);cursor:pointer;transition:transform .18s}
.plot-wide:active{transform:scale(.994)}
.plot-wide + .plot-wide{margin-top:10px}
.plot-wide-top{display:flex;align-items:center;gap:11px}
.plot-thumb{position:relative;width:66px;height:66px;border-radius:18px;overflow:hidden;background:linear-gradient(145deg,var(--tint),#FCFBF4);color:var(--tone);display:flex;align-items:center;justify-content:center;flex:none;border:1px solid rgba(255,255,255,.65)}
.plot-thumb .art-scene{position:absolute;left:0;right:0;bottom:-8px;height:60%;opacity:.32;width:100%}
.plot-thumb .ic{position:relative;z-index:2}
.plot-wide-main{flex:1;min-width:0}
.plot-wide-name{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.plot-wide-name b{font-size:14.5px;font-weight:800;letter-spacing:-.01em}
.plot-wide-meta{font-size:9.5px;color:var(--muted);margin-top:3px}
.plot-wide-price{text-align:right;flex:none}
.plot-wide-price b{display:block;font-family:var(--serif);font-size:16px;font-weight:600;color:var(--clay)}
.plot-wide-price span{display:block;font-size:8px;color:var(--muted-2);margin-top:1px}
.plot-wide-bar{margin-top:11px}
.plot-wide-foot{display:flex;align-items:center;gap:6px;margin-top:11px}
.plot-wide-foot .btn{flex:1;height:34px;border-radius:10px;font-size:10.5px}
.plot-wide-foot .icon-btn{width:34px;height:34px;border-radius:10px;background:var(--surface-2)}
.task-hint{display:flex;align-items:center;gap:7px;margin-top:10px;padding:8px 10px;border-radius:10px;background:var(--gold-100);color:#8A6828}
.task-hint span{flex:1;font-size:9.5px;font-weight:700}
.task-hint .sec-link{color:#8A6828;font-size:9.5px}
.empty{padding:44px 20px;text-align:center}
.empty-ic{width:58px;height:58px;margin:0 auto 12px;border-radius:18px;background:var(--green-50);color:var(--green-300);display:flex;align-items:center;justify-content:center}
.empty b{display:block;font-size:13px;font-weight:800}
.empty p{font-size:10px;color:var(--muted);line-height:1.7;margin-top:4px}

/* ===== 管护任务 · 林场场景 ===== */
.farm-scene{position:relative;overflow:hidden;border-radius:23px;border:1px solid rgba(28,39,32,.08);background:linear-gradient(180deg,#BFD9D2 0,#DCE8D4 138px,#CFDAB5 139px,#BFCB9F 100%);box-shadow:0 22px 44px -30px rgba(28,60,40,.6);margin-top:6px}
.scene-hud{position:relative;z-index:4;display:flex;align-items:center;gap:9px;padding:9px 10px;background:rgba(255,255,255,.76);border-bottom:1px solid rgba(255,255,255,.6);backdrop-filter:blur(14px)}
.hud-avatar{width:34px;height:34px;border-radius:11px;background:linear-gradient(150deg,#3B6A4B,#254D34);color:#EEF1E3;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:14px;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.hud-meta{flex:1;min-width:0}
.hud-name{display:flex;align-items:center;gap:5px}
.hud-name b{font-size:11.5px;font-weight:800}
.hud-lv{font-size:7.5px;font-weight:800;padding:1px 5px;border-radius:5px;background:var(--clay);color:#fff;letter-spacing:.02em}
.hud-xp{display:flex;align-items:center;gap:5px;margin-top:4px}
.hud-xp .progress{height:4px;background:rgba(28,39,32,.1)}
.hud-xp span{font-size:7.5px;color:var(--muted);white-space:nowrap}
.hud-right{text-align:right;flex:none}
.hud-coin{font-family:var(--serif);font-size:13px;font-weight:600;color:#8A6828}
.hud-weather{font-size:7.5px;color:var(--muted);margin-top:2px}
.scene-sky{position:relative;height:54px;overflow:hidden}
.scene-sun{position:absolute;right:22px;top:7px;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FBF0C9,#EAC775 70%);box-shadow:0 0 26px rgba(238,205,125,.85)}
.scene-cloud{position:absolute;color:#fff;opacity:.75;animation:cloud-drift 30s linear infinite}
.scene-cloud svg{display:block}
.scene-cloud.c1{top:9px;left:12px;animation-duration:34s}
.scene-cloud.c2{top:28px;left:76px;opacity:.55;animation-duration:44s;animation-delay:-18s}
@keyframes cloud-drift{from{transform:translateX(-60px)}to{transform:translateX(420px)}}
.scene-ridge{position:absolute;left:0;right:0;top:38px;height:74px;color:#9CB58A;opacity:.85;pointer-events:none}
.scene-ridge svg{width:100%;height:100%;display:block}
.farm-grid{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:8px 11px 12px}
.tile{position:relative;height:102px;border-radius:12px;border:1px solid #8F6B4C;background:linear-gradient(180deg,#A98563 0%,#977251 55%,#876446 100%);box-shadow:inset 0 0 0 3px rgba(120,89,63,.45),inset 0 1px 0 rgba(255,255,255,.14),0 4px 8px rgba(62,43,29,.22);cursor:pointer;padding:10px 7px 0;text-align:center;transition:transform .18s}
.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(180deg,transparent 0 12px,rgba(80,55,36,.13) 12px 13px);pointer-events:none}
.tile:active{transform:scale(.97)}
.tile-plant{position:relative;z-index:2;width:40px;height:40px;margin:0 auto;border-radius:12px;background:rgba(249,246,232,.9);color:var(--tone);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(45,30,20,.25),inset 0 1px 0 #fff}
.tile-name{position:relative;z-index:2;margin-top:6px;font-size:8px;font-weight:800;color:#FBF7EA;text-shadow:0 1px 2px rgba(45,30,20,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile-progress{position:absolute;z-index:2;left:8px;right:8px;bottom:8px;height:4px;border-radius:3px;background:rgba(48,31,20,.45);overflow:hidden}
.tile-progress i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#EBD08F,#C9A257)}
.tile.locked{background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,.22));border:1.5px dashed rgba(83,105,75,.4);box-shadow:none;backdrop-filter:blur(4px)}
.tile.locked::after{display:none}
.tile.locked .tile-plant{background:rgba(255,255,255,.55);color:#7B8B74;box-shadow:none}
.tile.locked .tile-name{color:#52644E;text-shadow:none}
.tile.locked .tile-hint{position:relative;z-index:2;font-size:7.5px;color:#7A8A73;margin-top:3px}
.bubble{position:absolute;top:-7px;right:-6px;z-index:3;width:30px;height:30px;border-radius:50%;background:#fff;border:2px solid var(--green);display:flex;align-items:center;justify-content:center;color:var(--green);box-shadow:0 5px 12px rgba(31,52,38,.28);animation:bob 1.8s ease-in-out infinite;cursor:pointer}
.bubble i{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);font-style:normal;font-size:7px;font-weight:800;background:var(--green);color:#fff;padding:1px 4px;border-radius:5px;white-space:nowrap}
.bubble.warn{border-color:var(--gold);color:#8A6828}
.bubble.warn i{background:var(--gold)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.pasture{position:relative;z-index:2;margin:0 11px 12px;padding:11px 9px 9px;border:1.5px solid #9A7856;border-radius:13px;background:rgba(255,255,255,.22);backdrop-filter:blur(4px)}
.pasture::before{content:"";position:absolute;left:-2px;right:-2px;top:-7px;height:5px;border-radius:3px;background:repeating-linear-gradient(90deg,#9A7856 0 13px,#7E5F43 13px 17px)}
.pasture-title{display:flex;align-items:center;gap:5px;font-size:8.5px;font-weight:800;color:#4C5E45;margin-bottom:7px}
.pasture-title span{font-weight:500;color:#6D7D65}
.pasture-pens{display:flex;gap:8px}
.pen{flex:1;position:relative;padding:7px 6px 6px;border-radius:10px;border:1.5px solid #A98764;background:rgba(255,251,240,.82);text-align:center;cursor:pointer;transition:transform .16s}
.pen:active{transform:scale(.97)}
.pen-animals{font-size:19px;letter-spacing:1px;line-height:1.25}
.pen b{display:block;font-size:8px;font-weight:800;margin-top:2px}
.pen span{display:block;font-size:7px;color:var(--muted);margin-top:1px}
.tool-scroll{display:flex;gap:6px;overflow-x:auto;margin:13px 0 15px;padding-bottom:2px;scrollbar-width:none}
.tool-scroll::-webkit-scrollbar{display:none}
.tool-chip{flex:none;height:34px;padding:0 11px;border-radius:11px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;gap:4px;font-size:10px;font-weight:700;color:var(--ink-2);cursor:pointer;box-shadow:0 6px 14px -14px rgba(28,39,32,.7)}
.tool-chip b{color:var(--green);font-size:9px;font-weight:800}
.task-filter{display:flex;gap:5px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;scrollbar-width:none}
.task-filter::-webkit-scrollbar{display:none}
.task-list{display:flex;flex-direction:column;gap:8px}
.task-card{display:flex;align-items:center;gap:10px;padding:11px;border-radius:15px;background:#fff;border:1px solid rgba(28,39,32,.06);box-shadow:0 10px 24px -26px rgba(28,39,32,.5)}
.task-card.done{opacity:.62}
.task-ic{width:40px;height:40px;border-radius:12px;background:var(--green-50);color:var(--green);display:flex;align-items:center;justify-content:center;flex:none}
.task-card.done .task-ic{background:#F0F1E9;color:#98A295}
.task-main{flex:1;min-width:0}
.task-main b{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:800}
.task-main .meta{font-size:9px;color:var(--muted);margin-top:2px}
.task-main .deadline{font-size:8.5px;color:var(--muted-2);margin-top:1px}
.task-actions{display:flex;gap:5px;flex:none}
.task-actions .btn{height:30px;padding:0 10px;border-radius:9px;font-size:9.5px}
.care-note{margin-top:14px;padding:13px;border-radius:15px;background:var(--green-50);border:1px solid rgba(47,96,66,.1)}
.care-note b{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;color:var(--green)}
.care-note p{font-size:9.5px;line-height:1.7;color:var(--muted);margin-top:5px}

/* ===== 采摘 / 体验 ===== */
.pick-intro{position:relative;overflow:hidden;margin-top:6px;padding:16px;border-radius:20px;background:linear-gradient(130deg,#EFEBD9,#E3EBDC);border:1px solid rgba(28,39,32,.05)}
.pick-intro b{display:block;font-size:15px;font-weight:800;letter-spacing:-.01em}
.pick-intro p{font-size:9.5px;line-height:1.65;color:var(--muted);margin-top:4px;max-width:230px}
.pick-intro .ic{position:absolute;right:12px;bottom:8px;color:#9BB08A;opacity:.65}
.sel-list{display:flex;flex-direction:column;gap:7px}
.sel-row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:13px;border:1.5px solid var(--line);background:#fff;cursor:pointer;transition:.2s}
.sel-row.on{border-color:var(--green);background:var(--green-50);box-shadow:0 0 0 3px rgba(47,96,66,.06)}
.sel-row .grow-thumb{width:40px;height:40px;border-radius:12px}
.sel-row b{display:block;font-size:11.5px;font-weight:800}
.sel-row small{display:block;font-size:8.5px;color:var(--muted);margin-top:2px}
.sel-check{width:18px;height:18px;border-radius:50%;border:1.5px solid #CBD1C5;flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.sel-row.on .sel-check{background:var(--green);border-color:var(--green)}
.date-strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}
.date-strip::-webkit-scrollbar{display:none}
.date-pill{flex:0 0 50px;text-align:center;padding:8px 2px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer;transition:.2s}
.date-pill b{display:block;font-family:var(--serif);font-size:16px;font-weight:600;line-height:1;color:var(--ink)}
.date-pill span{display:block;font-size:8px;color:var(--muted);margin-top:4px}
.date-pill.on{background:var(--green);border-color:var(--green);box-shadow:0 8px 18px -10px rgba(47,96,66,.9)}
.date-pill.on b,.date-pill.on span{color:#fff}
.slot-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.slot{height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:9.5px;font-weight:700;color:var(--ink-2);cursor:pointer;transition:.2s}
.slot.on{border-color:var(--green);background:var(--green-50);color:var(--green);box-shadow:0 0 0 2px rgba(47,96,66,.06)}
.delivery-option{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:#fff;cursor:pointer;margin-bottom:7px;transition:.2s}
.delivery-option:last-child{margin-bottom:0}
.delivery-option.on{border-color:var(--green);background:var(--green-50)}
.delivery-option .dv-ic{width:34px;height:34px;border-radius:10px;background:var(--green-50);color:var(--green);display:flex;align-items:center;justify-content:center;flex:none}
.delivery-option b{display:block;font-size:11.5px;font-weight:700}
.delivery-option small{display:block;font-size:8.5px;color:var(--muted);margin-top:1px}
.delivery-option .dv-price{font-size:9.5px;font-weight:800;color:var(--clay);flex:none}
.notice-list{font-size:9.5px;line-height:1.9;color:var(--muted)}
.notice-list div{display:flex;gap:6px}
.notice-list i{font-style:normal;color:var(--green);font-weight:800}
.exp-hero{position:relative;height:132px;margin-top:6px;border-radius:21px;overflow:hidden;background:linear-gradient(130deg,#25452F,#3C6749 62%,#5B825F);padding:18px;color:#F0F2E4;box-shadow:0 20px 38px -26px rgba(24,48,34,.8)}
.exp-hero h2{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-top:4px}
.exp-hero p{font-size:9.5px;color:rgba(240,242,228,.68);margin-top:5px;max-width:190px;line-height:1.6}
.exp-hero .ic{position:absolute;right:14px;bottom:14px;color:#D8E3C6;opacity:.7}
.exp-card{display:flex;align-items:center;gap:11px;padding:11px;border-radius:14px;border:1.5px solid var(--line);background:#fff;cursor:pointer;margin-bottom:7px;transition:.2s}
.exp-card:last-child{margin-bottom:0}
.exp-card.on{border-color:var(--green);background:var(--green-50);box-shadow:0 0 0 3px rgba(47,96,66,.06)}
.exp-ic{width:42px;height:42px;border-radius:12px;background:var(--tint,#EFF4EC);color:var(--tone,#2F6042);display:flex;align-items:center;justify-content:center;flex:none}
.exp-main{flex:1;min-width:0}
.exp-main b{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800}
.exp-main p{font-size:8.5px;color:var(--muted);line-height:1.55;margin-top:2px}
.exp-main small{display:flex;align-items:center;gap:3px;font-size:8px;color:var(--muted-2);margin-top:3px}
.exp-price{text-align:right;flex:none}
.exp-price b{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--clay)}
.exp-price span{display:block;font-size:7.5px;color:var(--muted);margin-top:1px}
.counter-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line-2)}
.counter-row:last-child{border-bottom:none}
.counter-row b{font-size:11.5px;font-weight:700}
.counter-row small{display:block;font-size:8.5px;color:var(--muted);margin-top:1px}
.counter{display:flex;align-items:center;gap:8px}
.counter button{width:28px;height:28px;border-radius:9px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-2);font-size:15px;line-height:1}
.counter button:active{transform:scale(.93)}
.counter span{min-width:20px;text-align:center;font-family:var(--serif);font-size:15px;font-weight:600}

/* ===== 消息 ===== */
.msg-banner{display:flex;align-items:center;gap:9px;margin:6px 0 13px;padding:11px 12px;border-radius:13px;background:linear-gradient(120deg,#F3EDDD,#F7F4E8);border:1px solid rgba(193,154,86,.18)}
.msg-banner .ic{color:#A9833E}
.msg-banner b{font-size:10.5px;font-weight:800;color:#765B28}
.msg-banner span{font-size:9px;color:#9A8A66;display:block;margin-top:2px}
.msg-card{display:flex;gap:10px;padding:13px;border-radius:16px;background:#fff;border:1px solid rgba(28,39,32,.06);box-shadow:0 10px 24px -28px rgba(28,39,32,.6);cursor:pointer;position:relative}
.msg-card + .msg-card{margin-top:8px}
.msg-card.unread{border-left:2.5px solid var(--green)}
.msg-ic{width:38px;height:38px;border-radius:12px;background:var(--green-50);color:var(--green);display:flex;align-items:center;justify-content:center;flex:none}
.msg-card.unread .msg-ic{background:var(--green-100)}
.msg-main{flex:1;min-width:0}
.msg-title{display:flex;align-items:center;gap:5px}
.msg-title b{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.msg-body{font-size:9.5px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-time{font-size:8px;color:var(--muted-2);margin-top:4px}
.msg-dot{width:6px;height:6px;border-radius:50%;background:var(--danger);flex:none}

/* ===== 个人中心 ===== */
.profile-hero{display:flex;align-items:center;gap:13px;padding:12px 2px 0}
.avatar-xl{width:66px;height:66px;border-radius:21px;background:linear-gradient(150deg,#3D6D4D,#224A32);color:#EEF1E3;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:26px;flex:none;border:2px solid rgba(255,255,255,.85);box-shadow:0 14px 26px -16px rgba(28,60,40,.8)}
.profile-meta{flex:1;min-width:0}
.profile-name{display:flex;align-items:center;gap:6px}
.profile-name b{font-size:19px;font-weight:800;letter-spacing:-.02em}
.level-pill{font-size:8px;font-weight:800;padding:2px 6px;border-radius:5px;background:var(--clay);color:#fff;letter-spacing:.02em}
.profile-id{font-size:9px;color:var(--muted);margin-top:4px;letter-spacing:.02em}
.profile-badges{display:flex;gap:4px;margin-top:7px}
.member-card{position:relative;overflow:hidden;margin-top:16px;padding:16px;border-radius:21px;background:linear-gradient(135deg,#223D2B,#33563D);color:#EFF1E4;box-shadow:0 22px 42px -28px rgba(25,49,34,.9)}
.member-card::after{content:"";position:absolute;right:-38px;top:-46px;width:180px;height:180px;border-radius:50%;border:1px solid rgba(255,255,255,.1);box-shadow:0 0 0 24px rgba(255,255,255,.03),0 0 0 48px rgba(255,255,255,.02)}
.member-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}
.member-top span{font-family:var(--serif);font-size:8.5px;letter-spacing:.18em;color:#C9D6BF}
.member-top b{font-size:10px;font-weight:700;color:#DCC28C;padding:3px 7px;border-radius:6px;background:rgba(220,194,140,.14)}
.member-balance{position:relative;z-index:2;display:flex;align-items:flex-end;gap:16px;margin-top:14px}
.member-balance b{display:block;font-family:var(--serif);font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1;color:#F6F2DF}
.member-balance span{display:block;font-size:8px;color:rgba(239,241,228,.5);margin-top:5px}
.member-xp{position:relative;z-index:2;margin-top:14px}
.member-xp .progress{height:5px;background:rgba(255,255,255,.14)}
.member-xp .progress-fill{background:linear-gradient(90deg,#DCC28C,#F0DFB6)}
.member-xp-label{display:flex;justify-content:space-between;font-size:8px;color:rgba(239,241,228,.56);margin-bottom:5px}
.menu-group{margin-top:13px;border-radius:18px;background:#fff;border:1px solid rgba(28,39,32,.06);overflow:hidden;box-shadow:var(--shadow-card)}
.menu-row{display:flex;align-items:center;gap:10px;padding:12px 13px;border-bottom:1px solid var(--line-2);cursor:pointer;transition:background .15s}
.menu-row:last-child{border-bottom:none}
.menu-row:active{background:var(--surface-2)}
.menu-ic{width:33px;height:33px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--green-50);color:var(--green)}
.menu-ic.clay{background:var(--clay-100);color:#8A5A3C}
.menu-ic.gold{background:var(--gold-100);color:#8A6828}
.menu-row b{flex:1;font-size:12px;font-weight:700}
.menu-val{font-size:9px;color:var(--muted);display:flex;align-items:center;gap:3px}
.menu-val .tag{height:18px;padding:0 6px;font-size:8px}
.version-foot{text-align:center;font-size:8.5px;color:var(--muted-2);padding:18px 0 4px;line-height:1.7}

/* ===== 订单 / FAQ ===== */
.order-tabs{display:flex;gap:5px;overflow-x:auto;margin-bottom:13px;padding-bottom:2px;scrollbar-width:none}
.order-tabs::-webkit-scrollbar{display:none}
.order-card{padding:13px;border-radius:16px;background:#fff;border:1px solid rgba(28,39,32,.06);box-shadow:0 10px 24px -28px rgba(28,39,32,.6);cursor:pointer}
.order-card + .order-card{margin-top:8px}
.order-top{display:flex;align-items:center;gap:9px}
.order-ic{width:38px;height:38px;border-radius:11px;background:var(--green-50);color:var(--green);display:flex;align-items:center;justify-content:center;flex:none}
.order-main{flex:1;min-width:0}
.order-main b{display:block;font-size:11.5px;font-weight:800}
.order-id{font-family:var(--mono);font-size:8px;color:var(--muted-2);margin-top:3px;letter-spacing:-.02em}
.order-mid{display:flex;align-items:flex-end;justify-content:space-between;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line-2)}
.order-mid span{font-size:9px;color:var(--muted)}
.order-mid b{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--clay)}
.search-wrap{position:relative;margin:4px 0 13px}
.search-wrap .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted-2)}
.search-input{width:100%;height:42px;padding:0 12px 0 38px;border:1px solid var(--line);border-radius:13px;background:#fff;font-size:12px;outline:none;color:var(--ink);transition:.2s}
.search-input:focus{border-color:var(--green-300);box-shadow:0 0 0 3px rgba(47,96,66,.07)}
.faq-item{border-bottom:1px solid var(--line-2)}
.faq-item:last-child{border-bottom:none}
.faq-q{display:flex;align-items:center;gap:9px;padding:13px 2px;cursor:pointer}
.faq-num{width:20px;height:20px;border-radius:50%;background:var(--green-50);color:var(--green);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:9px;font-weight:600;flex:none}
.faq-q b{flex:1;font-size:11.5px;font-weight:700;line-height:1.45}
.faq-arrow{color:var(--muted-2);transition:transform .25s}
.faq-item.open .faq-arrow{transform:rotate(180deg)}
.faq-a{max-height:0;overflow:hidden;transition:max-height .3s ease;font-size:10px;line-height:1.8;color:var(--muted);padding-left:29px}
.faq-item.open .faq-a{max-height:240px;padding-bottom:13px}
.contact-card{display:flex;align-items:center;gap:11px;margin-top:15px;padding:14px;border-radius:17px;background:linear-gradient(130deg,var(--green-50),#F7F4E7);border:1px solid rgba(47,96,66,.12)}
.contact-card .contact-ic{width:38px;height:38px;border-radius:12px;background:#fff;color:var(--green);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 6px 14px -10px rgba(28,39,32,.5)}
.contact-card .grow b{display:block;font-size:11.5px;font-weight:800}
.contact-card .grow > span{display:block;font-size:8.5px;color:var(--muted);margin-top:2px}

/* ===== 好友 / 排行 / 分享 ===== */
.myfarm-card{position:relative;overflow:hidden;margin-top:6px;padding:16px;border-radius:22px;background:linear-gradient(135deg,#274630,#3C6749 60%,#567E5B);color:#EFF1E4;box-shadow:0 22px 44px -28px rgba(25,49,34,.9)}
.myfarm-card::after{content:"";position:absolute;right:-50px;bottom:-70px;width:200px;height:200px;border-radius:50%;border:1px solid rgba(255,255,255,.1);box-shadow:0 0 0 26px rgba(255,255,255,.03)}
.myfarm-top{position:relative;z-index:2;display:flex;align-items:center;gap:11px}
.my-avatar{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);color:#F4F1DF;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:20px;flex:none}
.myfarm-name{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:800;letter-spacing:-.01em}
.lv-badge{font-size:8px;font-weight:800;padding:1px 5px;border-radius:5px;background:#DCC28C;color:#3A3020}
.myfarm-sub{font-size:9px;color:rgba(239,241,228,.6);margin-top:4px}
.my-score{text-align:right;flex:none}
.my-score b{display:block;font-family:var(--serif);font-size:25px;font-weight:600;line-height:1;color:#F6F2DF}
.my-score span{display:block;font-size:7.5px;color:rgba(239,241,228,.5);margin-top:4px}
.chase-tip{position:relative;z-index:2;margin-top:12px;padding:8px 10px;border-radius:9px;background:rgba(255,255,255,.1);font-size:9.5px;color:#DCE4D2;line-height:1.5}
.chase-tip b{color:#EAD3A0}
.myfarm-actions{position:relative;z-index:2;display:flex;gap:7px;margin-top:12px}
.myfarm-actions .btn{flex:1;height:34px;border-radius:10px;font-size:10px}
.lb-row{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px dashed var(--line-2)}
.lb-row:last-child{border-bottom:none}
.lb-rank{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:10px;font-weight:600;background:#F0F1E9;color:var(--muted);flex:none}
.lb-rank.r1{background:linear-gradient(150deg,#F4DFA8,#D9B66B);color:#6D4E1D}
.lb-rank.r2{background:linear-gradient(150deg,#E8EBE6,#C8D0C8);color:#4E5A50}
.lb-rank.r3{background:linear-gradient(150deg,#EAD0B6,#CE9C74);color:#6C462A}
.lb-avatar{width:30px;height:30px;border-radius:50%;background:var(--green-50);display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.lb-main{flex:1;min-width:0}
.lb-name{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:800}
.lb-sub{font-size:8px;color:var(--muted);margin-top:2px}
.lb-score{text-align:right;flex:none}
.lb-score b{font-family:var(--serif);font-size:14px;font-weight:600;color:var(--green)}
.lb-score .btn{margin-top:2px;height:22px;padding:0 8px;font-size:8.5px;border-radius:7px}
.act-row{display:flex;gap:9px;padding:10px 0;border-bottom:1px dashed var(--line-2);align-items:flex-start}
.act-row:last-child{border-bottom:none}
.act-ic{width:30px;height:30px;border-radius:9px;background:var(--green-50);display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.act-text{font-size:10px;line-height:1.55;color:var(--ink-2)}
.act-text b{font-weight:800;color:var(--ink)}
.act-text em{font-style:normal;color:var(--green);font-weight:700}
.act-time{font-size:8px;color:var(--muted-2);margin-top:2px}
.invite-card{margin-top:14px;padding:16px;border-radius:18px;background:linear-gradient(130deg,var(--clay-100),#F7F2E5);border:1px solid rgba(169,112,78,.14);text-align:center}
.invite-card .invite-ic{width:42px;height:42px;border-radius:14px;background:#fff;color:var(--clay);display:flex;align-items:center;justify-content:center;margin:0 auto 8px;box-shadow:0 8px 18px -12px rgba(28,39,32,.5)}
.invite-card b{display:block;font-size:13px;font-weight:800}
.invite-card p{font-size:9px;line-height:1.7;color:var(--muted);margin:4px 0 11px}
.session-list{display:flex;flex-direction:column;gap:10px}
.session-row{display:flex;align-items:center;gap:10px;font-size:10.5px;color:var(--ink-2)}
.session-row i{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none}
.session-row span{flex:1}
.session-row b{font-weight:700;color:var(--muted);font-size:9px}

/* ===== 实时监控 ===== */
.cam-strip{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.cam-strip::-webkit-scrollbar{display:none}
.cam-chip{flex:none;height:30px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;gap:4px;font-size:9px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.cam-chip .dot{width:5px;height:5px;border-radius:50%;background:#B9C4B0}
.cam-chip.on{background:var(--ink);border-color:var(--ink);color:#F3F1E5}
.cam-chip.on .dot{background:#9BE0A5;box-shadow:0 0 0 2px rgba(155,224,165,.22)}
.live-stage{position:relative;aspect-ratio:4/3;border-radius:19px;overflow:hidden;background:#1A2A20;box-shadow:0 22px 44px -28px rgba(20,40,25,.8)}
.live-scene{position:absolute;inset:0;transition:transform .35s ease,filter .3s ease;transform-origin:center}
.live-scene svg{display:block;width:100%;height:100%}
.live-cloud{animation:live-cloud-drift 30s linear infinite}
@keyframes live-cloud-drift{from{transform:translateX(-14px)}to{transform:translateX(30px)}}
.live-grain{position:absolute;inset:0;pointer-events:none;opacity:.22;background-image:radial-gradient(rgba(255,255,255,.55) .5px,transparent .7px);background-size:3px 3px;mix-blend-mode:overlay}
.live-vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 100% at 50% 45%,transparent 55%,rgba(7,15,10,.42) 100%)}
.scan-line{position:absolute;left:0;right:0;height:22%;background:linear-gradient(180deg,transparent,rgba(255,255,255,.055),transparent);animation:scan 6s linear infinite;pointer-events:none}
@keyframes scan{from{top:-24%}to{top:108%}}
.live-top{position:absolute;left:9px;right:9px;top:9px;display:flex;align-items:center;justify-content:space-between;gap:6px;pointer-events:none}
.lov-group{display:flex;align-items:center;gap:4px}
.lov-chip{padding:3px 7px;border-radius:6px;background:rgba(15,26,18,.46);color:#F3F4EA;font-size:8px;font-weight:600;backdrop-filter:blur(3px);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.lov-chip.strong{color:#D8F0D1}
.live-bottom{position:absolute;left:9px;right:9px;bottom:9px;display:flex;align-items:flex-end;justify-content:space-between;gap:6px;pointer-events:none}
.lov-time{font-family:var(--mono);font-size:8px;letter-spacing:.02em}
.ai-box{position:absolute;border:1px dashed rgba(209,238,176,.9);border-radius:8px;pointer-events:none;animation:ai-pulse 2.6s ease infinite;z-index:3}
.ai-box i{position:absolute;top:-9px;left:5px;font-style:normal;font-size:7.5px;font-weight:700;padding:1px 5px;border-radius:5px;background:#5F8D62;color:#fff;white-space:nowrap;letter-spacing:.02em}
@keyframes ai-pulse{50%{box-shadow:0 0 0 5px rgba(209,238,176,.14)}}
.live-controls{margin-top:11px;padding:12px;border-radius:17px;background:#fff;border:1px solid rgba(28,39,32,.06);box-shadow:var(--shadow-card)}
.live-controls-top{display:flex;align-items:center;gap:12px}
.ptz{display:grid;grid-template-columns:repeat(3,30px);grid-auto-rows:30px;gap:3px;flex:none}
.ptz button{border:1px solid var(--line);background:#FBFAF4;border-radius:9px;color:var(--ink-2);display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;line-height:1}
.ptz button:active{background:var(--green-50);transform:scale(.94)}
.ctrl-stack{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.ctrl-row{display:flex;align-items:center;gap:5px}
.zoom-val{min-width:34px;text-align:center;font-family:var(--mono);font-size:9px;color:var(--muted)}
.clarity-chips{display:flex;gap:4px}
.clarity-chip{height:26px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:#FBFAF4;font-size:8.5px;font-weight:700;color:var(--muted);cursor:pointer}
.clarity-chip.on{background:var(--green-50);border-color:var(--green-300);color:var(--green)}
.snap-btn{height:28px;border-radius:8px;font-size:9px}
.event-row{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px dashed var(--line-2)}
.event-row:last-child{border-bottom:none}
.event-ic{width:28px;height:28px;border-radius:8px;background:var(--green-50);color:var(--green);display:flex;align-items:center;justify-content:center;flex:none}
.event-main{flex:1;min-width:0}
.event-main b{display:block;font-size:9.5px;font-weight:700;line-height:1.4}
.event-main span{display:block;font-size:8px;color:var(--muted-2);margin-top:1px}
.live-foot{text-align:center;font-size:8px;line-height:1.8;color:var(--muted-2);padding:12px 8px 2px}

/* ===== 弹层 / 提示 / 分享 ===== */
.overlay{position:absolute;inset:0;z-index:210;display:flex;align-items:flex-end;justify-content:center;background:rgba(13,22,16,.48);backdrop-filter:blur(7px);opacity:0;visibility:hidden;transition:opacity .28s ease,visibility .28s}
.overlay.open{opacity:1;visibility:visible}
.sheet{width:100%;max-height:90%;border-radius:27px 27px 0 0;background:var(--paper);display:flex;flex-direction:column;overflow:hidden;transform:translateY(34px);transition:transform .38s cubic-bezier(.22,.9,.28,1);box-shadow:0 -24px 70px -20px rgba(0,0,0,.45)}
.overlay.open .sheet{transform:none}
.sheet-grab{width:38px;height:4px;border-radius:2px;background:#D3D1C4;margin:8px auto 0;flex:none}
#sheet-content{flex:1 1 auto;min-height:0;overflow-y:auto;padding:13px 18px calc(18px + var(--home-h));scrollbar-width:none;overscroll-behavior:contain}
#sheet-content::-webkit-scrollbar{display:none}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:15px}
.sheet-head h3{font-size:18px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.sheet-head p{font-size:9.5px;color:var(--muted);margin-top:3px;line-height:1.6}
.sheet-close{width:30px;height:30px;border-radius:50%;border:none;background:rgba(28,39,32,.06);color:var(--ink-2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.success-close{position:absolute;right:0;top:0;z-index:7;width:30px;height:30px;border-radius:50%;border:none;background:rgba(255,255,255,.78);color:var(--ink-2);display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(6px);box-shadow:0 4px 10px -6px rgba(28,39,32,.5)}
.sheet-actions{display:flex;gap:8px;margin-top:16px}
.sheet-actions .btn{flex:1;height:46px;border-radius:13px;font-size:12.5px}
.sheet-note{text-align:center;font-size:8.5px;color:var(--muted-2);line-height:1.7;margin-top:9px}
.filter-block{margin-bottom:16px}
.filter-label{font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.04em;margin-bottom:8px}
.chip-wrap{display:flex;flex-wrap:wrap;gap:6px}
.pick-chip{display:inline-flex;align-items:center;gap:4px;height:31px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:9.5px;font-weight:700;color:var(--ink-2);cursor:pointer}
.pick-chip.on{background:var(--green);border-color:var(--green);color:#fff}
.pick-chip .ic{color:currentColor}
.share-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:14px 0 4px}
.share-chan{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;font-size:8.5px;color:var(--muted);cursor:pointer;padding:0}
.share-ic{width:48px;height:48px;border-radius:15px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 8px 18px -12px rgba(28,39,32,.6);transition:transform .15s}
.share-chan:active .share-ic{transform:scale(.93)}
.share-ic.wechat{background:linear-gradient(150deg,#54B96A,#2F9E4A)}
.share-ic.moment{background:linear-gradient(150deg,#6FAFC2,#3C8299)}
.share-ic.poster{background:linear-gradient(150deg,#B98A64,#94673F)}
.share-ic.copy{background:linear-gradient(150deg,#8A9489,#667164)}
.poster{position:relative;overflow:hidden;border-radius:18px;padding:18px 16px 15px;background:linear-gradient(155deg,var(--green-100),#F7F2E3 72%);border:1px solid rgba(28,39,32,.07);text-align:center}
.poster-brand{display:flex;align-items:center;justify-content:center;gap:5px;font-size:8.5px;font-weight:800;letter-spacing:.05em;color:var(--green)}
.poster-title{font-size:18px;font-weight:800;letter-spacing:-.02em;margin-top:8px}
.poster-sub{font-size:9px;color:var(--muted);line-height:1.6;margin-top:4px}
.poster-icon{display:flex;justify-content:center;font-size:44px;line-height:1;margin:10px 0 4px;color:var(--green)}
.poster-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding:9px 11px;border-radius:11px;background:rgba(255,255,255,.72)}
.poster-foot .grow{text-align:left}
.poster-foot b{display:block;font-size:9.5px;font-weight:800}
.poster-foot span{display:block;font-size:7.5px;color:var(--muted);margin-top:2px}
.qr{width:52px;height:52px;flex:none;border-radius:5px;overflow:hidden;background:#fff;padding:2px}
.qr svg{display:block;width:100%;height:100%}
.compare-head{display:flex;align-items:center;justify-content:space-around;margin-bottom:16px}
.compare-side{text-align:center;width:96px}
.compare-avatar{width:46px;height:46px;margin:0 auto 5px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:17px;border:2px solid rgba(255,255,255,.8);box-shadow:0 8px 18px -12px rgba(28,39,32,.6)}
.compare-avatar.rival{background:var(--clay-100);color:#8A5A3C;font-size:21px}
.compare-side b{font-size:10px;font-weight:800;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.compare-side span{font-size:8px;color:var(--muted);display:block;margin-top:2px}
.vs{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--muted-2);letter-spacing:.05em}
.cmp-row{margin-bottom:12px}
.cmp-head{display:flex;align-items:center;justify-content:space-between;font-size:8.5px;color:var(--muted);margin-bottom:5px}
.cmp-vals{display:flex;align-items:center;gap:5px}
.cmp-vals i{width:5px;height:5px;border-radius:50%;display:inline-block}
.cmp-vals .me{color:var(--green);font-weight:800}
.cmp-vals .rival{color:var(--clay);font-weight:800}
.cmp-track{height:6px;border-radius:4px;background:#ECEDE3;overflow:hidden;margin-top:3px}
.cmp-track i{display:block;height:100%;border-radius:4px;transition:width .5s}
