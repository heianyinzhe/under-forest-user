.cmp-track.me i{background:linear-gradient(90deg,#7FA98B,#2F6042)}
.cmp-track.rival i{background:linear-gradient(90deg,#D2A783,#A06B47)}
.cmp-tip{padding:10px 11px;border-radius:10px;background:var(--green-50);font-size:9.5px;line-height:1.65;color:var(--green);margin:2px 0 14px}
.cmp-tip b{font-weight:800}
.plan-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line-2)}
.plan-row:last-child{border-bottom:none}
.plan-ic{width:30px;height:30px;border-radius:9px;background:var(--green-50);color:var(--green);display:flex;align-items:center;justify-content:center;flex:none}
.plan-row .grow b{display:block;font-size:10px;font-weight:700}
.plan-row .grow > span{display:block;font-size:8px;color:var(--muted);margin-top:1px}
.plan-tag{font-size:7.5px;padding:2px 6px;border-radius:5px;background:var(--gold-100);color:#8A6828;font-weight:800;flex:none}
.toast{position:absolute;left:50%;bottom:100px;transform:translate(-50%,10px);z-index:320;max-width:82%;padding:10px 15px;border-radius:12px;background:rgba(24,37,28,.93);color:#F4F3E8;font-size:10.5px;font-weight:700;line-height:1.5;text-align:center;box-shadow:0 16px 34px -18px rgba(0,0,0,.6);opacity:0;visibility:hidden;transition:opacity .25s,transform .25s,visibility .25s;backdrop-filter:blur(8px);pointer-events:none}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}
.confetti{position:absolute;top:-8px;width:6px;height:10px;border-radius:2px;opacity:.95;animation:confetti-fall 1.8s ease-in forwards;pointer-events:none;z-index:4}
@keyframes confetti-fall{to{transform:translateY(430px) rotate(560deg);opacity:0}}
.success-wrap{position:relative;overflow:hidden}
.mini-scene{position:relative;border-radius:13px;overflow:hidden;height:150px;background:#263A2B}
.mini-scene svg{width:100%;height:100%;display:block}
.mini-scene-label{position:absolute;left:8px;top:8px;padding:2px 7px;border-radius:6px;background:rgba(15,26,18,.5);color:#fff;font-size:7.5px;backdrop-filter:blur(3px)}
.stat-strip{display:flex;gap:8px;margin-top:12px}
.stat-box{flex:1;padding:10px;border-radius:11px;background:var(--surface-2);border:1px solid rgba(28,39,32,.04);text-align:center}
.stat-box b{display:block;font-family:var(--serif);font-size:16px;font-weight:600;color:var(--green)}
.stat-box span{display:block;font-size:7.5px;color:var(--muted);margin-top:3px}
.sheet .card{box-shadow:none}
.sheet-list{background:#fff;border:1px solid rgba(28,39,32,.06);border-radius:15px;overflow:hidden}
.sheet-list .kv{padding:10px 12px;margin:0;border-bottom:1px solid var(--line-2)}
.sheet-list .kv:last-child{border-bottom:none}

/* ===== 响应式 / 动效 ===== */
@media (max-width:1180px){
  .brand-panel{display:none}
  .stage{padding:22px}
}
@media (max-width:560px){
  .stage{padding:0;display:block;min-height:100dvh}
  .input,.textarea,.search-input{font-size:16px}
  .device{width:100%;height:100dvh;padding:0;border-radius:0;background:none;box-shadow:none}
  .device::after{display:none}
  .device-screen{border-radius:0}
  .statusbar{padding-top:env(safe-area-inset-top,0px);height:calc(var(--status-h) + env(safe-area-inset-top,0px))}
  .page{top:calc(var(--status-h) + env(safe-area-inset-top,0px))}
}
@media (max-height:700px) and (min-width:561px){
  .device{height:calc(100dvh - 20px)}
  .stage{padding:10px}
}
@media (hover:hover){
  .btn:hover{filter:brightness(1.03)}

  .tab:hover{color:var(--green)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}
}

  const d = new Date();
  return (d.getMonth() + 1) + '月' + d.getDate() + '日 · 周' + '日一二三四五六'[d.getDay()];
}
function nextDates(n = 7) {
  const out = [];
  const base = new Date();
  for (let i = 1; i <= n; i++) {
    const d = new Date(base.getFullYear(), base.getMonth(), base.getDate() + i);
    out.push({
      iso: d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'),
      day: d.getDate(),
      month: d.getMonth() + 1,
      week: '日一二三四五六'[d.getDay()],
      label: (d.getMonth() + 1) + '月' + d.getDate() + '日'
    });
  }
  return out;
}
function dateLabel(iso) {
  if (!iso) return '待选择';
  const d = nextDates(9).find(x => x.iso === iso);
  return d ? d.label + ' 周' + d.week : iso;
}
function isoDate(d = new Date()) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

function qrSVG(size = 52) {
  const n = 21;
  let rects = '';
  const inFinder = (x, y) => {
    const zones = [[0,0],[14,0],[0,14]];
    return zones.some(([zx, zy]) => x >= zx && x < zx + 7 && y >= zy && y < zy + 7);
  };
  for (let y = 0; y < n; y++) {
    for (let x = 0; x < n; x++) {
      let on = false;
      const zones = [[0,0],[14,0],[0,14]];
      for (const [zx, zy] of zones) {
        const lx = x - zx, ly = y - zy;
        if (lx >= 0 && lx < 7 && ly >= 0 && ly < 7) {
          const edge = lx === 0 || lx === 6 || ly === 0 || ly === 6;
          const core = lx >= 2 && lx <= 4 && ly >= 2 && ly <= 4;
          on = edge || core;
        }
      }
      if (!inFinder(x, y)) on = ((x * 7 + y * 11 + x * y * 3) % 13) < 6;
      if (on) rects += '<rect x="' + x + '" y="' + y + '" width="1" height="1" rx=".18"/>';
    }
  }
  return '<svg viewBox="-1 -1 23 23" width="' + size + '" height="' + size + '" fill="#1C2720" aria-hidden="true"><rect x="-1" y="-1" width="23" height="23" fill="#fff"/>' + rects + '</svg>';
}

function goStage(pageId, param) {
  if (TAB_PAGES.includes(pageId)) switchTab(pageId);
  else navigateTo(pageId, param || undefined);

function syncStage(pageId) {
  $$('#panel-nav button').forEach(b => b.classList.toggle('active', b.dataset.page === pageId));
}
function updateChrome() {
  const isTab = TAB_PAGES.includes(currentPage);
  const tabbar = $('#tabbar');
  if (tabbar) tabbar.classList.toggle('is-hidden', !isTab);
  $$('#tabbar .tab').forEach(t => t.classList.toggle('active', t.dataset.tab === currentPage));
  syncStage(currentPage);
}
function showPage(pageId) {
  const page = document.getElementById('page-' + pageId);
  if (!page) return;
  if (currentPage === 'live' && pageId !== 'live' && liveTimer) { clearInterval(liveTimer); liveTimer = null; }
  if ($('#overlay') && $('#overlay').classList.contains('open')) closeSheet();
  $$('.page').forEach(p => p.classList.remove('active'));
  page.classList.add('active');
  currentPage = pageId;
  updateChrome();
  const scroller = page.querySelector('.page-scroll');
  if (scroller) scroller.scrollTop = 0;
}
function navigateTo(pageId, data) {
  const pid = typeof data === 'string' ? data : (data && data.plotId);
  if (pageId === 'plot-detail') currentDetailPlot = pid || currentDetailPlot || 'P002';
  if (pageId === 'pick' && pid) pickPlotId = pid;
  if (pageId === 'adopt') {
    adoptStep = 1;
    adoptAgree = true;
    if (pid) adoptPlotId = pid;
    const target = plotOf(adoptPlotId);
    if (!target || target.status !== 'available') {
      const first = PLOTS.find(p => p.status === 'available');
      if (first) adoptPlotId = first.id;
    }
  }
  if (pageId === 'live') {
    if (pid) {
      livePlotId = pid;
      const camPlot = plotOf(pid);
      if (camPlot && camPlot.owner === '我') liveCamPid = pid;
      else if (camPlot) showToast('该地块暂未接入摄像头，已为你切换');
    }
    if (!LIVE_CAMS.find(c => c.pid === liveCamPid)) liveCamPid = LIVE_CAMS[0].pid;
  }
  if (pageHistory[pageHistory.length - 1] !== pageId) pageHistory.push(pageId);
  showPage(pageId);
  renderPage(pageId);
}
function goBack() {
  if (pageHistory.length > 1) {
    pageHistory.pop();
    const prev = pageHistory[pageHistory.length - 1];
    showPage(prev);
    renderPage(prev);
  } else {
    switchTab('home');
  }
}
function switchTab(tab) {
  pageHistory = [tab];
  showPage(tab);
  renderPage(tab);
}
function renderPage(pageId) {
  if (pageId === 'home') renderHome();
  else if (pageId === 'map') renderMapPage();
  else if (pageId === 'my-plots') renderMyPlots();
  else if (pageId === 'tasks') renderTasks();
  else if (pageId === 'pick') renderPick();
  else if (pageId === 'experience') renderExperience();
  else if (pageId === 'messages') renderMessages();
  else if (pageId === 'profile') renderProfile();
  else if (pageId === 'orders') renderOrders();
  else if (pageId === 'faq') renderFaq();
  else if (pageId === 'friends') renderFriends();
  else if (pageId === 'live') renderLive();
  else if (pageId === 'plot-detail') renderPlotDetail();
  else if (pageId === 'adopt') renderAdopt();
  updateTabBadge();
}

function mapZoom(dir) {
  const ns = clamp(+(mapState.s + dir * 0.2).toFixed(2), 0.8, 2.2);
  const k = ns / mapState.s;
  const maxX = 130 * ns;
  const maxY = 170 * ns;
  mapState.x = clamp(200 - (200 - mapState.x) * k, -maxX, maxX);
  mapState.y = clamp(360 - (360 - mapState.y) * k, -maxY, maxY);
  mapState.s = ns;
  applyMapView();
}
function mapReset() {
  mapState.x = 0; mapState.y = 0; mapState.s = 1;
  applyMapView();
  showToast('地图已复位');
}
function bindMapEvents() {
  const svgEl = $('#map-svg');
  if (!svgEl) return;
  let drag = null, moved = false, pressed = null;
  svgEl.addEventListener('pointerdown', e => {
    drag = {x:e.clientX, y:e.clientY, ox:mapState.x, oy:mapState.y};
    moved = false;
    pressed = e.target.closest ? e.target.closest('.map-plot') : null;
    try { svgEl.setPointerCapture(e.pointerId); } catch (err) {}
  });
  svgEl.addEventListener('pointermove', e => {
    if (!drag) return;
    const rect = svgEl.getBoundingClientRect();
    const k = 1 / (Math.max(rect.width / 400, rect.height / 720) * mapState.s);
    const dx = (e.clientX - drag.x) * k;
    const dy = (e.clientY - drag.y) * k;
    if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
    if (moved) {
      const maxX = 130 * mapState.s;
      const maxY = 170 * mapState.s;
      mapState.x = clamp(drag.ox + dx, -maxX, maxX);
      mapState.y = clamp(drag.oy + dy, -maxY, maxY);
      applyMapView();
    }
  });
  const end = () => {
    if (drag && !moved && pressed) mapSelect(pressed.dataset.id);
    drag = null;
    pressed = null;
  };
  svgEl.addEventListener('pointerup', end);
  svgEl.addEventListener('pointercancel', () => { drag = null; pressed = null; });
}

function adoptCalc(p) {
  const base = Math.round(p.price * adoptDuration);
  const fee = Math.round(base * 0.05);
  return {
    base,
    fee,
    total: base + fee,
    months: adoptDuration === 0.5 ? 6 : adoptDuration * 12,
    label: adoptDuration === 0.5 ? '半年' : adoptDuration === 1 ? '一年' : '两年'
  };
}
function setAdoptDuration(d) {

function adoptBack() {

function openPaySheet() {
  const p = plotOf(adoptPlotId) || PLOTS[0];
  const calc = adoptCalc(p);
  if (payTimer) { clearTimeout(payTimer); payTimer = null; }
  payInput = '';
  payGuard = false;
  const keys = ['1','2','3','4','5','6','7','8','9','','0','del'];
  openSheet(
    sheetHead('输入支付密码', (adoptPayMethod === 'wechat' ? '微信支付' : '余额支付') + ' · 原型演示，输入任意 6 位') +

    '<div class="keypad">' + keys.map(k => {
      if (k === '') return '<button class="key blank" tabindex="-1"></button>';
      if (k === 'del') return '<button class="key del" onclick="payDel()">删除</button>';
      return '<button class="key" onclick="payKey(\'' + k + '\')">' + k + '</button>';
    }).join('') + '</div>' +
    '<div class="sheet-note">支付服务由微信支付提供 · 原型不会产生真实扣款</div>'
  );

function payKey(n) {
  if (payGuard || payInput.length >= 6) return;
  payInput += n;
  updatePayDots();
  if (payInput.length === 6) {
    payGuard = true;
    payTimer = setTimeout(completeAdopt, 280);
  }
}
function payDel() {
  if (payInput.length >= 6) {
    payGuard = false;
    if (payTimer) { clearTimeout(payTimer); payTimer = null; }
  }
  payInput = payInput.slice(0, -1);
  updatePayDots();
}
function updatePayDots() {
  $$('#pay-dots .pay-dot').forEach((d, i) => d.classList.toggle('filled', i < payInput.length));
}
function completeAdopt() {
  payTimer = null;
  payGuard = false;
  const p = plotOf(adoptPlotId) || PLOTS[0];
  const calc = adoptCalc(p);
  if (p.status === 'available') {
    p.status = 'adopted';
    p.owner = '我';
    p.progress = 8;
    TASKS.unshift({id:'T' + Date.now().toString().slice(-4), plot:p.name, type:'除草', icon:'grass', date:'11月20日', status:'pending'});
  }
  MESSAGES.unshift({id:'M' + Date.now(), title:'认养成功', body:'恭喜您成功认养 ' + p.name + ' 地块，专属管护任务已生成。', time:'刚刚', read:false, type:'order'});
  ORDERS.unshift({
    id:'ORD-' + Date.now().toString().slice(-9),
    type:'认养',
    icon:'sprout',
    plot:p.name,
    amount:calc.total,
    status:'已完成',
    date:isoDate(),
    method:adoptPayMethod === 'wechat' ? '微信支付' : '余额支付',

  adoptStep = 1;

  closeSheet();

  switchTab('my-plots');
  showAdoptSuccess(p);

}

        '<span style="width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;flex:none">' + (i + 1) + '</span>' +

function showCompare(fid) {
  const f = FRIENDS.find(x => x.id === fid);
  if (!f) return;
  const me = myFarmStats();
  const fRate = (f.done + f.todo) ? Math.round(f.done / (f.done + f.todo) * 100) : 100;
  const rows = [
    {label:'认养地块数', m:me.plots, t:f.plots, max:4, unit:'块'},
    {label:'平均生长进度', m:me.avg, t:f.avg, max:100, unit:'%'},
    {label:'管护完成率', m:me.rate, t:fRate, max:100, unit:'%'},
    {label:'管护总分', m:me.score, t:f.score, max:Math.max(me.score, f.score) * 1.15, unit:'分'}
  ];
  const wins = rows.filter(r => r.m >= r.t).length;
  const need = f.score > me.score ? Math.ceil((f.score - me.score) / 10) : 0;

    sheetHead('实力对比', '和 ' + f.name + ' 的林场比一比') +

function livePtz(dir) {
  const step = 16;
  if (dir === 'home') { livePan = {x:0,y:0}; applyLiveTransform(); showToast('云台已复位'); return; }
  if (dir === '←') livePan.x -= step;
  if (dir === '→') livePan.x += step;
  if (dir === '↑') livePan.y += step;
  if (dir === '↓') livePan.y -= step;
  if (dir === '↖') { livePan.x -= step; livePan.y += step; }
  if (dir === '↗') { livePan.x += step; livePan.y += step; }
  if (dir === '↙') { livePan.x -= step; livePan.y -= step; }
  if (dir === '↘') { livePan.x += step; livePan.y -= step; }
  livePan.x = clamp(livePan.x, -60, 60);
  livePan.y = clamp(livePan.y, -40, 40);
  applyLiveTransform();
  showToast('云台已转至 ' + dir + ' 方向（模拟）');
}

  const s = $('#live-scene');
  if (s) s.style.filter = cl === '流畅' ? 'blur(1.2px) saturate(.85)' : cl === '标清' ? 'blur(.4px)' : 'none';
  $$('.clarity-chip').forEach(b => b.classList.toggle('on', b.textContent === cl));
}
function liveSnapshot() {
  const cam = LIVE_CAMS.find(c => (c.pid || null) === (liveCamPid || null)) || LIVE_CAMS[3];
  const p = cam.pid ? plotOf(cam.pid) : null;
  const c = p ? catOf(p.cat) : null;
  openSheet(
    sheetHead('画面截图', cam.name + ' · 已加水印') +
    '<div class="mini-scene">' + liveSceneSVG(p, c) +
      '<span class="mini-scene-label">' + cam.name + '</span>' +
      '<span style="position:absolute;right:8px;bottom:8px;font-family:var(--mono);font-size:7px;color:#fff;background:rgba(15,26,18,.5);padding:2px 6px;border-radius:5px">' + liveClockText() + '</span></div>' +
    '<div style="font-size:9px;color:var(--muted);margin:9px 2px;line-height:1.7">' + (p ? p.name + ' · ' + p.area + ' · 生长进度 ' + p.progress + '% · ' : '') +
      'AI 识别：' + (p ? '长势正常 优' : '畜群活动正常') + ' · 截图已加水印</div>' +
    '<div class="sheet-actions"><button class="btn btn-outline" onclick="showToast(\'已保存到相册（原型模拟）\');closeSheet()">保存相册</button>' +
      '<button class="btn btn-wood" onclick="showShareSheet(\'card\')">分享画面</button></div>'
  );
}
function liveSettings() {
  openSheet(
    sheetHead('画面设置', '当前摄像头：' + (LIVE_CAMS.find(c => (c.pid || null) === (liveCamPid || null)) || LIVE_CAMS[3]).name) +
    '<div class="card card--pad0" style="padding:2px 14px">' +
      '<div class="care-line"><span class="care-ic">' + svg('camera', 16) + '</span><div class="grow"><b>画面镜像</b><span>左右翻转画面方向</span></div><button class="btn btn-xs btn-outline" onclick="showToast(\'画面镜像已切换（模拟）\')">切换</button></div>' +
      '<div class="care-line"><span class="care-ic">' + svg('sparkle', 16) + '</span><div class="grow"><b>夜视模式</b><span>弱光环境下自动开启</span></div><button class="btn btn-xs btn-outline" onclick="showToast(\'夜视模式已开启（模拟）\')">开启</button></div>' +
      '<div class="care-line"><span class="care-ic">' + svg('bell', 16) + '</span><div class="grow"><b>移动侦测推送</b><span>有动物或人员进入时通知</span></div><button class="btn btn-xs btn-outline" onclick="showToast(\'移动侦测推送已开启（模拟）\')">开启</button></div>' +
    '</div>' +
    '<div class="care-note"><b>' + svg('info', 13) + ' 安心养服务</b><p>升级后可解锁 7 天云存储、夜视增强与 AI 异常告警。原型演示中暂不产生费用。</p></div>' +
    '<div class="sheet-actions"><button class="btn btn-primary" onclick="closeSheet();showToast(\'已了解安心养服务\')">知道了</button></div>'
  );
}

/* ================= 初始化 ================= */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSheet();
  if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.matches && e.target.matches('[role="button"][tabindex="0"]')) {
    e.preventDefault();
    e.target.click();
  }
});
initStageNav();
updateTabBadge();
tickClock();
setInterval(tickClock, 30000);
renderHome();
syncStage('home');
</script>
</body>
</html>
